<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>고무팔 · 대항해</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="고무팔">
<meta name="theme-color" content="#0d1b26">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --deep:#0d1b26;
    --sun:#f0a24e;
    --rope:#d9b877;
    --sail:#efe2c4;
    --blood:#b03a34;
    --cream:#f4ecd9;
    --cream-dim:rgba(244,236,217,.55);
  }
  *{box-sizing:border-box;}
  /* 길게 눌러도 글자 선택·확대·복사 메뉴가 뜨지 않게 */
  body,canvas,button,.touch,.stage{
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }
  canvas,button{-webkit-user-drag:none;}
  html,body{margin:0;min-height:100%;}
  body{
    background:var(--deep);color:var(--cream);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    display:flex;justify-content:center;padding:18px 12px 30px;
  }
  .wrap{width:100%;max-width:940px;}
  header{
    display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
    padding-bottom:10px;border-bottom:1px solid rgba(217,184,119,.35);
  }
  h1{margin:0;font-size:22px;font-weight:700;}
  h1 small{display:block;margin-top:5px;font-size:12px;font-weight:400;color:var(--sun);}
  .hud{display:flex;gap:18px;text-align:right;font-variant-numeric:tabular-nums;}
  .hud span{display:block;font-size:11px;color:var(--cream-dim);margin-bottom:2px;}
  .hud b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:22px;font-weight:700;}
  .hud .tr b{color:var(--rope);}
  .hud .sp b{color:var(--sun);}
  .stage{
    margin-top:12px;border:1px solid rgba(217,184,119,.3);
    border-radius:4px;overflow:hidden;background:#0a1620;touch-action:none;
  }
  canvas{display:block;width:100%;height:auto;outline:none;cursor:crosshair;}
  .row{margin-top:12px;display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;}
  .bar{font-size:13px;color:var(--cream-dim);display:flex;flex-wrap:wrap;gap:6px 18px;flex:1;min-width:240px;}
  .bar b{
    color:var(--cream);font-family:ui-monospace,Menlo,monospace;font-size:11.5px;font-weight:600;
    border:1px solid rgba(244,236,217,.24);border-radius:3px;padding:1px 5px;
  }
  #pauseBtn{
    background:rgba(217,184,119,.12);border:1px solid rgba(217,184,119,.42);
    color:var(--rope);border-radius:5px;padding:9px 16px;font-size:14px;font-weight:600;
    font-family:inherit;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;
  }
  #pauseBtn:active{background:rgba(217,184,119,.3);}

  /* ---- 터치 기기: 전체화면 게임 레이아웃 ---- */
  .touch, .rotate{display:none;}
  @media (pointer:coarse){
    body{padding:0;background:#000;height:100dvh;overflow:hidden;}
    .wrap{max-width:none;height:100dvh;display:flex;align-items:center;justify-content:center;}
    header,.row{display:none;}
    .stage{
      margin:0;border:0;border-radius:0;position:relative;
      width:min(100vw, calc(100dvh * 1.6667));
    }
    .touch{display:block;position:absolute;inset:0;pointer-events:none;}
    .tb,.tpause{
      pointer-events:auto;touch-action:none;-webkit-tap-highlight-color:transparent;
      background:rgba(244,236,217,.10);border:2px solid rgba(217,184,119,.45);
      color:#f4ecd9;font-family:inherit;font-weight:700;
      display:flex;align-items:center;justify-content:center;
      backdrop-filter:blur(2px);
    }
    .tb{border-radius:50%;}
    .tb:active,.tpause:active{background:rgba(217,184,119,.38);}
    .tleft{position:absolute;left:3.5vw;bottom:4vh;display:flex;gap:3vw;}
    .tleft .tb{width:16vw;height:16vw;max-width:78px;max-height:78px;font-size:5vw;}
    .tright{position:absolute;right:3.5vw;bottom:3vh;display:flex;flex-direction:column;
            align-items:center;gap:2vh;}
    .tright .tb.small{width:13vw;height:13vw;max-width:62px;max-height:62px;font-size:4vw;}
    .tright .tb.big{
      width:22vw;height:22vw;max-width:108px;max-height:108px;font-size:5vw;
      background:rgba(217,184,119,.22);border-color:rgba(217,184,119,.8);
    }
    .tskill{
      position:absolute;left:3.5vw;bottom:23vh;
      width:15vw;height:15vw;max-width:72px;max-height:72px;font-size:2.9vw;
      background:rgba(240,162,78,.24);border-color:rgba(240,162,78,.85);
    }
    .tskill.cool{opacity:.4;border-color:rgba(217,184,119,.3);background:rgba(244,236,217,.06);}
    .tskill2{
      position:absolute;left:3.5vw;bottom:41vh;
      width:15vw;height:15vw;max-width:72px;max-height:72px;font-size:2.9vw;
      background:rgba(143,79,208,.24);border-color:rgba(143,79,208,.85);
    }
    .tskill2.cool{opacity:.4;border-color:rgba(217,184,119,.3);background:rgba(244,236,217,.06);}
    .tpause{
      position:absolute;top:2vh;right:3vw;
      width:44px;height:34px;border-radius:6px;font-size:13px;
    }
    .mhud{
      position:absolute;top:1.6vh;left:3vw;
      font-family:ui-monospace,Menlo,monospace;font-weight:700;
      color:#f4ecd9;text-shadow:0 1px 3px rgba(0,0,0,.7);line-height:1.25;
    }
    .mhud b{font-size:5vw;}
    .mhud span{display:block;font-size:2.6vw;font-weight:400;color:#d9b877;}
  }
  @media (pointer:coarse) and (orientation:portrait){
    .rotate{
      display:flex;position:fixed;inset:0;z-index:60;background:#0d1b26;
      align-items:center;justify-content:center;flex-direction:column;gap:14px;
      color:#f4ecd9;text-align:center;padding:24px;
    }
    .rotate .ico{font-size:44px;}
    .rotate p{margin:0;font-size:15px;color:rgba(244,236,217,.7);}
  }
  @media (max-width:520px){
    h1{font-size:18px;} .hud b{font-size:17px;} .hud{gap:11px;}
    #pauseBtn{width:100%;padding:14px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>고무팔<small>돛대를 건너 바다를 가로지른다</small></h1>
    <div class="hud">
      <div><span>거리</span><b id="dist">0</b></div>
      <div class="sp"><span>속도</span><b id="spd">0</b></div>
      <div class="tr"><span>보물</span><b id="style">0</b></div>
      <div><span>최고</span><b id="best">0</b></div>
    </div>
  </header>

  <div class="stage">
    <canvas id="game" tabindex="0" aria-label="해적선 스윙 게임"></canvas>

    <div class="touch">
      <div class="mhud"><b id="mdist">0</b><span id="mtre">보물 0</span></div>
      <button class="tpause" data-k="pause">❚❚</button>
      <div class="tleft">
        <button class="tb" data-k="left">◀</button>
        <button class="tb" data-k="right">▶</button>
      </div>
      <button class="tb tskill" id="skillBtn" data-k="skill">피스톨</button>
      <button class="tb tskill2" id="gunBtn" data-k="gun">건</button>
      <div class="tright">
        <button class="tb small" data-k="up">▲</button>
        <button class="tb big" data-k="grab">팔</button>
        <button class="tb small" data-k="down">▼</button>
      </div>
    </div>
  </div>

  <div class="rotate">
    <div class="ico">📱↻</div>
    <div style="font-size:19px;font-weight:700">가로로 돌려주세요</div>
    <p>이 게임은 가로 화면에서만 제대로 보여요</p>
  </div>

  <div class="row">
    <div class="bar">
      <span><b>누르고 있기</b>(마우스/Space) 팔 걸기 · 떼면 발사</span>
      <span><b>← →</b> 매달렸을 땐 그네 밀기, 공중에선 방향 조절</span>
      <span><b>↓</b> 줄 감아 오르기 / 공중에선 급강하</span>
      <span><b>↑</b> 도약하며 놓기</span>
      <span><b>F</b> 고무고무 피스톨(20초) · <b>G</b> 엘리펀트 건(2분)</span>
      <span><b>P</b> 또는 <b>Esc</b> 일시정지 · <b>R</b> 다시 시작</span>
    </div>
    <button id="pauseBtn">❚❚ 일시정지</button>
  </div>
</div>

<script>
/* 소리 관련 코드 없음: Audio / AudioContext / <audio> / vibrate 미사용 */
(function(){
"use strict";

const W = 900, H = 540;
const SEA = 486;

const GRAV   = 0.36;
const K1     = 0.040;    // 고무의 기본 장력
const K2     = 0.0018;   // 많이 늘어날수록 뻣뻣해지는 정도 (비선형)
const DAMP   = 0.085;    // 늘었다 줄었다 하는 진동만 잡는 감쇠
const STRETCH= 1.40;     // 이 배율을 넘으면 더는 안 늘어난다
const REEL   = 0.30;     // 팔을 타고 조금씩 올라간다
const REEL_MIN = 74;     // 여기까지만 — 더 감기면 진자 운동이 죽는다
const ZIP    = 1.15;     // ↓ 로 직접 감아 올릴 때 (46까지 바짝 당길 수 있다)
const GRAB_CD= 10;       // 팔을 놓고 다시 걸기까지
const REACH  = 310;
const AIR    = 0.150;
const PUMP   = 0.115;
const DIVE   = 0.30;
const MAXV   = 27;

/* 고무고무 피스톨 */
const SKILL_CD  = 60*20;    // 재충전 20초 — 시작할 땐 충전된 상태
const FIST_SPD  = 33;       // 주먹이 날아가는 속도
const FIST_LIFE = 26;       // 뻗어 있는 프레임 (약 860px 사거리)
const FIST_R    = 22;

/* 고무고무 엘리펀트 건 — 묵직한 광역 한 방 */
const GUN_CD    = 60*120;   // 재충전 2분
const GUN_R     = 150;      // 충격 반경
const GUN_LIFE  = 34;       // 이펙트 지속 프레임

/* 잡몹 */
const KING_H    = 300;      // 해왕류가 솟구치는 높이
const KING_W    = 52;       // 목 굵기 (반지름)

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const distEl = document.getElementById("dist");
const spdEl = document.getElementById("spd");
const styleEl = document.getElementById("style");
const bestEl = document.getElementById("best");
const pauseBtn = document.getElementById("pauseBtn");

function fit(){
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = Math.round(W*dpr);
  canvas.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
fit();
window.addEventListener("resize", fit);

const STATE = { READY:0, PLAY:1, OVER:2, PAUSE:3 };

let p, cam, anchors, coins, rope, state, dist, best = 0, treasure,
    lastAX, lastAY, holding, missAnim, bits, pops, overAt, time,
    airTime, deathReason, chain,
    boss, shots, nextBossAt, nextBigAt, bossKills, lastBossType, stun, iframes, grabCd, pPrevX, pPrevY,
    mobs, lastKingX, skillCd, fist, gunCd, gun;

function reset(){
  p = { x:150, y:150, vx:7.4, vy:0, face:1 };
  cam = { x:0, z:1 };
  anchors = [];
  coins = [];
  rope = null;
  state = STATE.READY;
  dist = 0;
  treasure = 0;
  chain = 0;
  bits = [];
  pops = [];
  missAnim = null;
  time = 0;
  airTime = 0;
  deathReason = "";
  boss = null;
  shots = [];
  nextBossAt = 500;
  nextBigAt = 2000;
  bossKills = 0;
  lastBossType = -1;
  stun = 0;
  iframes = 0;
  grabCd = 0;
  mobs = [];
  lastKingX = 0;
  skillCd = 0;                 // 출발할 땐 충전되어 있다
  fist = null;
  gunCd = 0;                   // 엘리펀트 건도 출발할 땐 충전
  gun = null;
  holding = false;              // 리셋 시 눌림 상태도 함께 초기화 (안 그러면 재시작 직후 팔이 안 걸릴 수 있다)
  pPrevX = p.x; pPrevY = p.y;
  anchors.push({ x:250, y:96, kind:0 });
  anchors.push({ x:470, y:108, kind:1 });
  lastAX = 470; lastAY = 108;
  generate();
  syncHUD();
}

function syncHUD(){
  distEl.textContent = Math.floor(dist);
  spdEl.textContent = Math.round(Math.hypot(p.vx, p.vy) * 4);
  styleEl.textContent = Math.floor(treasure);
  bestEl.textContent = Math.floor(best);
  pauseBtn.textContent = state === STATE.PAUSE ? "▶ 계속하기" : "❚❚ 일시정지";
  const md = document.getElementById("mdist"), mt = document.getElementById("mtre");
  if(md) md.textContent = Math.floor(dist) + "m";
  if(mt) mt.textContent = "보물 " + Math.floor(treasure) + " · 최고 " + Math.floor(best) + "m";
  const sb = document.getElementById("skillBtn");
  if(sb){
    const cd = Math.max(0, skillCd || 0);
    sb.classList.toggle("cool", cd > 0);
    sb.textContent = cd > 0 ? Math.ceil(cd/60) + "초" : "피스톨";
  }
  const gb = document.getElementById("gunBtn");
  if(gb){
    const gcd = Math.max(0, gunCd || 0);
    gb.classList.toggle("cool", gcd > 0);
    gb.textContent = gcd > 0 ? Math.ceil(gcd/60) + "초" : "건";
  }
}

/* ---------- 지형 ---------- */
function anchorBaseY(atDist){
  const t = Math.min(1, atDist / 1300);
  return 96 + t * 118;                        // 처음엔 높게, 갈수록 낮게
}
function gapFor(atDist){
  const t = Math.min(1, atDist / 1500);
  const base = 176 + t * 104;
  return Math.min(340, base + Math.random() * (62 + t*26));
}

function generate(){
  const limit = cam.x + W + 560;
  while(lastAX < limit){
    const gap = gapFor(lastAX / 22);
    const x = lastAX + gap;
    const baseY = anchorBaseY(x / 22);
    const jitter = (Math.random() - 0.5) * 96;
    const y = Math.max(64, Math.min(268, baseY*0.68 + lastAY*0.32 + jitter));
    anchors.push({ x, y, kind: Math.random() < 0.62 ? 0 : 1 });   // 0 돛대, 1 바위 기둥

    if(Math.random() < 0.5){
      coins.push({
        x: lastAX + gap*0.52 + (Math.random()-0.5)*46,
        y: Math.max(80, Math.min(SEA-70, (lastAY + y)/2 + 58 + Math.random()*70)),
        got:false
      });
    }
    spawnMobs(lastAX, x);
    lastAX = x; lastAY = y;
  }
  anchors = anchors.filter(a => a.x > cam.x - 320);
  coins   = coins.filter(c => c.x > cam.x - 320);
  mobs    = mobs.filter(m => m.x > cam.x - 420 && !m.gone);
}

/* ---------- 잡몹 ---------- */
// 두 고리 사이 구간(x0~x1)에 잡몹을 뿌린다
function spawnMobs(x0, x1){
  const dm = x1 / 22;                          // 이 구간의 m 환산 거리

  // 식인 물고기 — 떼로 다니고, 지나갈 때 물 밖으로 튀어오른다
  if(dm > 90 && Math.random() < (dm < 400 ? 0.20 : 0.30)){
    const n = 1 + Math.floor(Math.random()*3);
    const bx = x0 + (x1-x0)*0.35 + Math.random()*90;
    for(let i=0;i<n;i++){
      mobs.push({
        kind:0, x: bx + i*(34 + Math.random()*26), y: SEA + 16 + Math.random()*22,
        vy:0, air:false, t: Math.random()*60, cool: 20 + Math.random()*70, gone:false
      });
    }
  }

  // 해왕류 — 드물게, 한참 간격을 두고 나온다
  if(dm > 520 && x1 - lastKingX > 2600 && Math.random() < 0.34){
    lastKingX = x1;
    mobs.push({
      kind:1, x: x1 + 120 + Math.random()*160, y: SEA,
      phase:0, t:0, h:0, gone:false
    });
  }
}

// 선분(이전 위치 → 현재 위치)과 세로 캡슐의 최단거리
function segToCapsule(cx, top, bot){
  const near = (px, py) => Math.hypot(px - cx, Math.max(top, Math.min(bot, py)) - py);
  const mx = (pPrevX + p.x)/2, my = (pPrevY + p.y)/2;
  return Math.min(near(p.x, p.y), near(pPrevX, pPrevY), near(mx, my));
}

function updateMobs(dt){
  for(let i=mobs.length-1;i>=0;i--){
    const m = mobs[i];
    m.t += dt;
    if(m.gone){ mobs.splice(i,1); continue; }

    if(m.kind === 0){
      /* ---- 식인 물고기 ---- */
      if(m.air){
        m.vy += 0.30*dt;
        m.y  += m.vy*dt;
        m.x  -= 1.1*dt;
        if(m.y > SEA + 18){
          m.air = false; m.y = SEA + 16; m.vy = 0;
          m.cool = 70 + Math.random()*80;
          for(let k=0;k<5;k++) spark(m.x, SEA, "#8fd6d8");
        }
      } else {
        m.y = SEA + 14 + Math.sin(m.t*0.06)*6;
        m.cool -= dt;
        // 플레이어가 앞쪽에서 다가오면 튀어오른다
        if(m.cool <= 0 && p.x > m.x - 330 && p.x < m.x + 40){
          m.air = true;
          m.vy = -(7.6 + Math.random()*2.8);
          for(let k=0;k<6;k++) spark(m.x, SEA, "#8fd6d8");
        }
      }
      if(m.air && stun <= 0 && iframes <= 0){
        const d = distOriginToSeg(pPrevX - m.x, pPrevY - m.y, p.x - m.x, p.y - m.y);
        if(d < 15 + 13){
          knock(false, true);
          m.gone = true;
          for(let k=0;k<10;k++) spark(m.x, m.y, "#b03a34");
        }
      }

    } else {
      /* ---- 해왕류 ---- */
      const gap = m.x - p.x;
      if(m.phase === 0){                       // 잠복 — 물 밑 그림자
        if(gap < 660){
          m.phase = 1; m.t = 0;
          pops.push({ x:p.x, y:p.y-90, t:130, text:"⚠ 해왕류 접근! 피스톨/엘리펀트 건으로 물리쳐라", color:"#b03a34" });
        }
      } else if(m.phase === 1){                // 경고 — 물이 끓는다
        if(m.t % 6 < 1) spark(m.x + (Math.random()-0.5)*70, SEA, "#8fd6d8");
        if(m.t > 46){ m.phase = 2; m.t = 0; }
      } else if(m.phase === 2){                // 솟구침
        m.h += (KING_H - m.h) * 0.14 * dt;
        if(m.h > KING_H - 6){ m.phase = 3; m.t = 0; }
      } else if(m.phase === 3){                // 버티고 서 있다
        m.h = KING_H + Math.sin(m.t*0.05)*10;
        if(m.t > 150 || gap < -260){ m.phase = 4; m.t = 0; }
      } else {                                 // 잠수
        m.h += (0 - m.h) * 0.10 * dt;
        if(m.h < 6) m.gone = true;
      }

      // 목부터 머리까지 통째로 즉사 판정
      if(m.h > 30 && state === STATE.PLAY){
        const top = SEA - m.h;
        if(segToCapsule(m.x, top, SEA + 20) < KING_W + 12) return die("해왕류");
        const dh = distOriginToSeg(pPrevX - m.x, pPrevY - (top - 26), p.x - m.x, p.y - (top - 26));
        if(dh < 74 + 12) return die("해왕류");
      }
    }
  }
}

/* ---------- 입력 ---------- */
const keys = { left:false, right:false, down:false };

function pickAnchor(){
  let pick = null, bd = 1e9;
  for(const a of anchors){
    const dx = a.x - p.x, dy = a.y - p.y;
    const d = Math.hypot(dx, dy);
    if(d > REACH) continue;
    if(a.y > p.y + 130) continue;
    if(a.x < p.x - 100) continue;
    if(a.cut) continue;
    const ahead = p.vx >= 0 ? (dx + 60) : (60 - dx);
    const cost = d - Math.max(0, ahead) * 0.35;
    if(cost < bd){ bd = cost; pick = a; }
  }
  return pick;
}

function togglePause(){
  if(state === STATE.PLAY){ state = STATE.PAUSE; }
  else if(state === STATE.PAUSE){ state = STATE.PLAY; last = performance.now(); }
  syncHUD();
}

function grab(){
  if(state === STATE.PAUSE){ togglePause(); return; }
  if(state === STATE.READY) state = STATE.PLAY;
  if(state === STATE.OVER){
    if(performance.now() - overAt > 450) reset();
    return;
  }
  holding = true;
  if(stun > 0 || grabCd > 0){ missAnim = { t:1, x:p.x + 80*p.face, y:p.y - 50 }; return; }
  const a = pickAnchor();
  if(a){
    const d = Math.hypot(a.x - p.x, a.y - p.y);
    const safe = SEA - 52 - a.y;
    // 팔을 뻗어 걸면 고무가 수축하며 몸을 끌어올린다.
    // 다만 충분히 날아온 뒤라야 제대로 수축한다 — 놓자마자 다시 걸면 거의 안 당겨진다
    const fresh = Math.min(1, airTime / 20);
    const pull = 0.99 - 0.09 * fresh;
    rope = { a, len: Math.max(48, Math.min(d*pull, safe)) };
    if(airTime > 34){
      chain++;
      const gain = Math.floor(airTime*0.55 + Math.hypot(p.vx,p.vy)*3) * Math.min(4, chain);
      treasure += gain;
      pops.push({ x:p.x, y:p.y-26, t:70, text:"+" + gain, color:"#d9b877" });
      for(let i=0;i<10;i++) spark(p.x, p.y, "#d9b877");
    }
    airTime = 0;
  } else {
    missAnim = { t:1, x:p.x + 160*p.face, y:p.y - 120 };
    grabCd = Math.max(grabCd, 12);          // 헛손질에도 잠깐 딜레이
  }
}

function release(boost){
  holding = false;
  if(state === STATE.PAUSE) return;
  if(rope){
    const dx = rope.a.x - p.x, dy = rope.a.y - p.y;
    const d = Math.hypot(dx, dy) || 1;
    const ext = Math.max(0, d - rope.len);
    const k = 1 + Math.min(0.14, ext/300);
    p.vx *= k; p.vy *= k;
    if(boost){
      p.vy -= 5.4;
      p.vx += 1.5 * (p.vx >= 0 ? 1 : -1);
      pops.push({ x:p.x, y:p.y-30, t:50, text:"도약", color:"#f0a24e" });
    }
    rope = null;
    grabCd = GRAB_CD;                        // 놓은 뒤 곧바로 다시 못 건다
  }
}

function keyName(e){
  if(e.code) return e.code;
  const k = e.key;
  if(k === " " || k === "Spacebar") return "Space";
  if(k === "Escape" || k === "Esc") return "Escape";
  if(["Left","Right","Up","Down"].indexOf(k) >= 0) return "Arrow" + k;
  return k || "";
}

window.addEventListener("keydown", (e)=>{
  const k = keyName(e);
  if(k === "KeyP" || k === "Escape"){ e.preventDefault(); togglePause(); return; }
  if(k === "KeyR"){ reset(); return; }
  if(state === STATE.PAUSE){
    if(k === "Space"){ e.preventDefault(); togglePause(); }
    return;
  }
  if(k === "Space"){ e.preventDefault(); if(!holding) grab(); }
  else if(k === "ArrowLeft" || k === "KeyA"){ e.preventDefault(); keys.left = true; }
  else if(k === "ArrowRight" || k === "KeyD"){ e.preventDefault(); keys.right = true; }
  else if(k === "ArrowDown" || k === "KeyS"){ e.preventDefault(); keys.down = true; }
  else if(k === "ArrowUp" || k === "KeyW"){ e.preventDefault(); release(true); }
  else if(k === "KeyF" || k === "KeyE" || k === "ShiftLeft" || k === "ShiftRight"){ e.preventDefault(); firePistol(); }
  else if(k === "KeyG"){ e.preventDefault(); fireGun(); }
}, {passive:false});

window.addEventListener("keyup", (e)=>{
  const k = keyName(e);
  if(k === "Space") release(false);
  else if(k === "ArrowLeft" || k === "KeyA") keys.left = false;
  else if(k === "ArrowRight" || k === "KeyD") keys.right = false;
  else if(k === "ArrowDown" || k === "KeyS") keys.down = false;
});

canvas.addEventListener("mouseenter", ()=>{ try{ canvas.focus({preventScroll:true}); }catch(e){} });
let canvasHold = false;
canvas.addEventListener("pointerdown", (e)=>{
  e.preventDefault();
  try{ window.focus(); canvas.focus({preventScroll:true}); }catch(err){}
  canvasHold = true;
  grab();
});
window.addEventListener("pointerup", ()=>{ if(canvasHold){ canvasHold = false; release(false); } });
window.addEventListener("pointercancel", ()=>{ if(canvasHold){ canvasHold = false; release(false); } });
canvas.addEventListener("contextmenu", e => e.preventDefault());

// ---- 화면 조작 버튼 (폰·태블릿) ----
document.querySelectorAll(".tb, .tpause").forEach((btn)=>{
  const k = btn.dataset.k;
  const press = (e)=>{
    e.preventDefault(); e.stopPropagation();
    if(k === "left"){ keys.left = true; }
    else if(k === "right"){ keys.right = true; }
    else if(k === "down"){ keys.down = true; }
    else if(k === "up"){ release(true); }
    else if(k === "grab"){ if(!holding) grab(); }
    else if(k === "skill"){ firePistol(); }
    else if(k === "gun"){ fireGun(); }
    else if(k === "pause"){ togglePause(); }
  };
  const lift = (e)=>{
    e.preventDefault(); e.stopPropagation();
    if(k === "left"){ keys.left = false; }
    else if(k === "right"){ keys.right = false; }
    else if(k === "down"){ keys.down = false; }
    else if(k === "grab"){ release(false); }
  };
  btn.addEventListener("pointerdown", press);
  btn.addEventListener("pointerup", lift);
  btn.addEventListener("pointercancel", lift);
  btn.addEventListener("pointerleave", lift);
  btn.addEventListener("contextmenu", (e)=> e.preventDefault());
});

pauseBtn.addEventListener("click", (e)=>{
  e.preventDefault();
  togglePause();
  try{ canvas.focus({preventScroll:true}); }catch(err){}
});

/* ---------- 진행 ---------- */
function spark(x, y, color){
  const a = Math.random()*Math.PI*2, s = 1 + Math.random()*3.4;
  bits.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 1.2, life:1, color });
}

function die(reason){
  state = STATE.OVER;
  deathReason = reason;
  overAt = performance.now();
  if(dist > best){ best = dist; saveBest(); }
  syncHUD();
  for(let i=0;i<26;i++) spark(p.x, p.y, reason === "바다" ? "#8fd6d8" : "#f0a24e");
}

/* ---------- 보스 ---------- */
const BOSSES = [
  { name:"곡예사 선장",   tag:"단검을 부채처럼 던진다" },
  { name:"작살잡이",     tag:"공중에 뜬 순간이 빈틈" },
  { name:"포함 흑조호",   tag:"돛대 위 화약통이 약점" },
  { name:"밧줄 끊는 자",  tag:"앞쪽 고리를 끊어 놓는다" },
  { name:"심해의 크라켄", tag:"눈이 드러난 순간에만 통한다", big:true }
];

function clearCuts(){
  for(const a of anchors) a.cut = 0;
}

function spawnBoss(big){
  let type;
  if(big) type = 4;
  else {
    const pool = [0,1,2,3].filter(t => t !== lastBossType);
    type = pool[Math.floor(Math.random()*pool.length)];
    lastBossType = type;
  }
  boss = { type, big:!!big, hp: big ? 8 : 2, maxHp: big ? 8 : 2,
           t:0, life: big ? 60*95 : 60*40, fire: big ? 90 : 90,
           invul:0, flash:0, x:p.x + 560, y:120, vy:0, air:false,
           phase:0, sub:0, perch:null, tents:[], swing:0, sink:0, dive:0 };
  if(type === 1) boss.y = SEA + 40;
  if(type === 2) boss.y = SEA - 8;
  if(type === 4){ boss.y = SEA - 40; boss.sub = 200; }
  pops.push({ x:p.x + 60, y:p.y - 70, t:140,
              text: (big ? "▲ 대형 ▲ " : "현상수배 · ") + BOSSES[type].name,
              color: big ? "#8f4fd0" : "#b03a34" });
}

// 약점은 여러 개이고, 대부분 움직인다. 같은 자리만 노려선 안 되도록.
function weakPoints(b){
  const out = [];
  if(b.type === 0){
    // 기구는 위, 곡예사는 그 아래에서 좌우로 흔들린다
    out.push({ x:b.x + Math.sin(b.t*0.045)*30, y:b.y - 58, r:30, mark:"기구" });
    out.push({ x:b.x + b.swing, y:b.y, r:24, mark:"곡예사" });

  } else if(b.type === 1){
    if(b.air){
      out.push({ x:b.x, y:b.y, r:34, mark:"몸통" });
      // 솟구쳐 오르는 동안엔 꼬리도 노출된다
      if(b.vy < 0) out.push({ x:b.x - 8, y:b.y + 34, r:20, mark:"꼬리" });
    }

  } else if(b.type === 2){
    if(b.sink > 12) return out;              // 잠항 중엔 노려도 닿지 않는다
    // 화약통을 도르래로 올렸다 내렸다 한다
    out.push({ x:b.x, y:SEA - 152 + Math.sin(b.t*0.022)*46 + b.sink, r:26, mark:"화약통" });
    // 갑판 뒤쪽 예비 화약통 — 낮아서 위험하지만 확실하다
    out.push({ x:b.x - 74, y:SEA - 42 + b.sink, r:20, mark:"예비통" });

  } else if(b.type === 3){
    out.push({ x:b.x, y:b.y, r:28, mark:"몸통" });
    // 매달린 밧줄 끝 — 아래로 지나가며 스쳐도 맞는다
    out.push({ x:b.x + Math.sin(b.t*0.06)*22, y:b.y + 78, r:19, mark:"밧줄 끝" });

  } else {
    if(b.phase === 0){
      // 눈이 좌우를 두리번거린다
      out.push({ x:b.x + Math.sin(b.t*0.035)*34, y:b.y - 74, r:30, mark:"눈" });
    } else {
      // 잠수 중에도 숨구멍이 주기적으로 열린다
      const open = (b.t % 150) < 62;
      if(open) out.push({ x:b.x + 40, y:SEA - 26, r:24, mark:"숨구멍" });
    }
  }
  return out;
}

function knock(hard, mild){
  if(stun > 0 || iframes > 0) return;      // 연속 피격으로 갇히지 않도록
  stun = hard ? 42 : mild ? 20 : 30;       // mild = 잡몹에 스친 정도
  iframes = mild ? 60 : 78;
  rope = null;
  chain = 0;
  p.vx *= hard ? 0.34 : mild ? 0.74 : 0.52;
  p.vy = Math.min(p.vy, -3.2);
  pops.push({ x:p.x, y:p.y-28, t:50, text:"휘청", color:"#b03a34" });
  for(let i=0;i<12;i++) spark(p.x, p.y, "#b03a34");
}

function damageBoss(ranged, mark){
  const b = boss;
  b.hp--; b.flash = 16; b.invul = b.big ? 44 : 30;
  treasure += b.big ? 60 : 40;
  if(!ranged){
    p.vy = -7.6;
    p.vx = Math.max(6.5, Math.abs(p.vx)*0.88);
    rope = null;
  }
  pops.push({ x: ranged ? b.x : p.x, y: (ranged ? b.y : p.y) - 30, t:60,
              text: (mark ? mark + " " : "") + "명중 +" + (b.big?60:40), color:"#d9b877" });
  for(let i=0;i<16;i++) spark(b.x, b.y, b.big ? "#8f4fd0" : "#f0a24e");
  if(b.big && b.hp > 0){ b.phase = 1; b.sub = 150; }     // 맞으면 물속으로 숨는다
  if(b.hp <= 0){
    const bounty = b.big ? (600 + bossKills*80) : (150 + bossKills*40);
    treasure += bounty;
    pops.push({ x:b.x, y:b.y-40, t:130, text:"격침 +" + bounty, color:"#d9b877" });
    for(let i=0;i<40;i++) spark(b.x, b.y, "#d9b877");
    bossKills++;
    if(b.big){ nextBigAt = Math.max(nextBigAt + 2000, dist + 900); nextBossAt = dist + 500; }
    else nextBossAt = dist + 500;
    clearCuts();
    boss = null;
    shots = [];
  }
}

function aimShot(from, speed, spread, kind, r){
  let tx = p.x, ty = p.y;
  for(let k=0;k<3;k++){
    const tt = Math.min(70, Math.hypot(tx-from.x, ty-from.y) / speed);
    tx = p.x + p.vx*tt*(0.96 + Math.random()*0.08);
    ty = Math.max(30, Math.min(SEA-24, p.y + p.vy*tt*0.62));
  }
  const base = Math.atan2(ty - from.y, tx - from.x) + spread;
  shots.push({ x:from.x, y:from.y, vx:Math.cos(base)*speed, vy:Math.sin(base)*speed,
               g:0.02, r:r||9, kind:kind||0, spin:0 });
}

function updateBoss(dt){
  const b = boss;
  b.t += dt; b.life -= dt;
  if(b.flash > 0) b.flash -= dt;
  if(b.invul > 0) b.invul -= dt;

  if(b.type === 0){
    {
      const CAP = 8.8;                                   // 곡예사 최고 속도
      const want = Math.min(p.vx, CAP*0.9) + ((p.x + 300) - b.x) * 0.030;
      b.x += Math.max(-4, Math.min(CAP, want)) * dt;
    }
    b.y = 100 + Math.sin(b.t*0.028)*36;
    b.swing = Math.sin(b.t*0.045 - 0.85)*34;      // 기구 아래에서 진자처럼 흔들린다
    b.fire -= dt;
    if(b.fire <= 0){
      b.fire = Math.max(62, 112 - bossKills*4);
      for(let i=-1;i<=1;i++) aimShot({x:b.x + b.swing, y:b.y}, 6.6, i*0.21, 0, 9);
    }

  } else if(b.type === 1){
    {
      const CAP = 9.6;
      const want = Math.min(p.vx, CAP*0.9) + ((p.x + 120 + p.vx*16) - b.x) * 0.030;
      b.x += Math.max(-4, Math.min(CAP, want)) * dt;
    }
    if(b.air){
      b.vy += 0.235*dt;
      b.y += b.vy*dt;
      if(b.y >= SEA + 40){
        b.y = SEA + 40; b.air = false; b.vy = 0;
        b.fire = Math.max(64, 104 - bossKills*5);
        for(let i=0;i<14;i++) spark(b.x, SEA, "#8fd6d8");
      }
    } else {
      b.y = SEA + 40;
      b.fire -= dt;
      if(b.fire <= 0){ b.air = true; b.vy = -16.8; }
    }

  } else if(b.type === 2){
    b.y = SEA - 8;
    if(b.dive === 1){                       // 가라앉는다
      b.sink += 5.2*dt;
      if(b.t % 3 < 1) spark(b.x + (Math.random()-0.5)*150, SEA, "#8fd6d8");
      if(b.sink >= 168){ b.sink = 168; b.dive = 2; }

    } else if(b.dive === 2){                // 물밑에서만 낼 수 있는 속도
      // 플레이어보다 반드시 빨라야 한다 — 안 그러면 영영 못 따라잡고 떠오르지도 못한다
      b.x += Math.max(17, Math.abs(p.vx) + 7) * dt;
      if(b.t % 2 < 1) spark(b.x + (Math.random()-0.5)*90, SEA + 2, "#8fd6d8");
      if(b.x > p.x + 360) b.dive = 3;

    } else if(b.dive === 3){                // 다시 떠오른다
      b.sink -= 4.4*dt;
      if(b.t % 3 < 1) spark(b.x + (Math.random()-0.5)*120, SEA, "#efe2c4");
      if(b.sink <= 0){ b.sink = 0; b.dive = 0; b.fire = 70; }
    }
    if(b.dive !== 0) return;                // 잠항 중엔 조준도 사격도 없다

    {
      const CAP = 8.0;
      const want = Math.min(p.vx, CAP*0.9) + ((p.x + 260) - b.x) * 0.022;
      b.x += Math.max(-4, Math.min(CAP, want)) * dt;
    }
    if(b.x < p.x - 200){ b.dive = 1; return; }   // 뒤처지면 잠항해서 따라붙는다
    b.fire -= dt;
    if(b.fire <= 0){
      b.fire = Math.max(66, 116 - bossKills*5);
      const from = { x:b.x, y:SEA - 152 + Math.sin(b.t*0.022)*46 };
      const T = 48, g = 0.16;
      const tx = p.x + p.vx*T*0.88;
      const ty = Math.max(40, Math.min(SEA-30, p.y + p.vy*T*0.40));
      shots.push({ x:from.x, y:from.y, vx:(tx-from.x)/T, vy:(ty-from.y)/T - 0.5*g*T,
                   g, r:11, kind:1, spin:0 });
    }

  } else if(b.type === 3){
    // 앞쪽 고리에 올라앉아 밧줄을 끊어 둔다
    b.fire -= dt;
    const valid = anchors.filter(a => a.x > p.x + 40).sort((u,v)=>u.x-v.x);
    // 바로 다음 고리에 앉아 버틴다 — 지나쳐 가야만 자리를 옮긴다
    if(!b.perch || b.perch.x < p.x - 40 || b.fire <= 0){
      if(b.perch) b.perch.cut = 0;
      b.perch = valid[0] || null;
      b.fire = 300;
    }
    if(b.perch){
      b.perch.cut = 1;
      b.x += ((b.perch.x) - b.x) * 0.22 * dt;
      b.y += ((b.perch.y - 16) - b.y) * 0.22 * dt;
    }

  } else {
    // 크라켄
    {
      const CAP = 9.8;                                   // 크라켄은 조금 더 빠르다
      const want = Math.min(p.vx, CAP*0.9) + ((p.x + 290) - b.x) * 0.030;
      b.x += Math.max(-4, Math.min(CAP, want)) * dt;
    }
    b.sub -= dt;
    const rage = b.hp <= 3 ? 0.66 : 1;

    if(b.phase === 0){                       // 떠오름 — 눈이 약점
      b.y += ((SEA - 46) - b.y) * 0.07 * dt;
      b.fire -= dt;
      if(b.fire <= 0){
        b.fire = 74 * rage;
        for(let i=-1;i<=1;i++) aimShot({x:b.x, y:b.y-40}, 5.6, i*0.26, 1, 13);
      }
      if(b.sub <= 0){ b.phase = 1; b.sub = 210 * rage; }
    } else {                                 // 잠수 — 촉수가 올라온다
      b.y += ((SEA + 120) - b.y) * 0.07 * dt;
      b.fire -= dt;
      if(b.fire <= 0){
        b.fire = 74 * rage;
        const tx = p.x + 200 + Math.random()*320;
        b.tents.push({ x:tx, t:0, h:0, hmax: 190 + Math.random()*150, life: 130 });
        // 촉수가 근처 고리를 끊는다
        for(const a of anchors) if(Math.abs(a.x - tx) < 62) a.cut = 80;
      }
      if(b.sub <= 0){ b.phase = 0; b.sub = 260; b.fire = 40; }
    }

    for(let i=b.tents.length-1;i>=0;i--){
      const tt = b.tents[i];
      tt.t += dt; tt.life -= dt;
      tt.h += ((tt.life > 60 ? tt.hmax : 0) - tt.h) * 0.10 * dt;
      if(tt.life <= 0){ b.tents.splice(i,1); continue; }
      if(stun <= 0 && tt.h > 26){
        const top = SEA - tt.h;
        const near = (px,py)=>{
          const cy = Math.max(top, Math.min(SEA, py));
          return Math.hypot(px - tt.x, py - cy);
        };
        const mx = (pPrevX + p.x)/2, my = (pPrevY + p.y)/2;
        if(Math.min(near(p.x,p.y), near(pPrevX,pPrevY), near(mx,my)) < 26 + 13) knock(true);
      }
    }
  }

  // 완전히 뒤처지면 싸움이 성립하지 않으므로 앞쪽으로 다시 붙는다
  if(b.type !== 3 && b.type !== 2 && b.x < p.x - 240){
    for(let i=0;i<10;i++) spark(b.x, b.y, "#4a3a5a");
    b.x = p.x + 430;
    if(b.type === 1){ b.air = false; b.y = SEA + 40; b.fire = 60; }
    for(let i=0;i<10;i++) spark(b.x, b.y, "#4a3a5a");
  }

  // 끊긴 고리는 시간이 지나면 복구
  for(const a of anchors) if(a.cut > 1) a.cut -= dt;

  if(b.invul <= 0){
    for(const wp of weakPoints(b)){
      const d = distOriginToSeg(pPrevX - wp.x, pPrevY - wp.y, p.x - wp.x, p.y - wp.y);
      if(d < wp.r + 14){
        if(Math.hypot(p.vx, p.vy) >= 8 && stun <= 0) damageBoss(false, wp.mark);
        else knock(false);
        break;
      }
    }
  }

  if(boss && b.life <= 0){
    pops.push({ x:b.x, y:b.y-40, t:90, text:"물러났다", color:"#f0a24e" });
    if(b.big){ nextBigAt = Math.max(nextBigAt + 2000, dist + 900); nextBossAt = dist + 500; }
    else nextBossAt = dist + 500;
    clearCuts();
    boss = null;
    shots = [];
  }
}

function distOriginToSeg(ax, ay, bx, by){
  const dx = bx-ax, dy = by-ay;
  const l2 = dx*dx + dy*dy;
  let t = l2 ? -(ax*dx + ay*dy) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(ax + dx*t, ay + dy*t);
}

function updateShots(dt){
  for(let i=shots.length-1;i>=0;i--){
    const q = shots[i];
    const px0 = q.x, py0 = q.y;
    q.vy += q.g*dt;
    q.x += q.vx*dt; q.y += q.vy*dt;
    q.spin += 0.22*dt;
    if(stun <= 0){
      const d = distOriginToSeg(px0 - pPrevX, py0 - pPrevY, q.x - p.x, q.y - p.y);
      if(d < q.r + 13){ shots.splice(i,1); knock(false); continue; }
    }
    if(q.y > SEA + 12 || q.x < cam.x - 140 || q.x > cam.x + W + 260 || q.y < -260){
      shots.splice(i,1);
    }
  }
}

/* ---------- 고무고무 피스톨 ---------- */
function pistolAim(){
  // 보스가 앞에 있으면 약점을, 없으면 가장 가까운 잡몹을 노린다
  let best = null, bd = 1e9;
  const consider = (tx, ty) => {
    if(tx < p.x - 60) return;
    const d = Math.hypot(tx - p.x, ty - p.y);
    if(d < bd && d < 860){ bd = d; best = { x:tx, y:ty }; }
  };
  if(boss) for(const wp of weakPoints(boss)) consider(wp.x, wp.y);
  for(const m of mobs){
    if(m.kind === 0 && m.air) consider(m.x, m.y);
    if(m.kind === 1 && m.h > 30) consider(m.x, SEA - m.h - 26);
  }
  if(best) return Math.atan2(best.y - p.y, best.x - p.x);
  return p.face > 0 ? -0.10 : Math.PI + 0.10;      // 목표가 없으면 정면으로
}

function firePistol(){
  if(state !== STATE.PLAY || skillCd > 0 || fist || stun > 0) return;
  skillCd = SKILL_CD;
  const a = pistolAim();
  fist = { x:p.x, y:p.y, px:p.x, py:p.y,
           vx:Math.cos(a)*FIST_SPD, vy:Math.sin(a)*FIST_SPD, life:FIST_LIFE, back:false };
  pops.push({ x:p.x, y:p.y-34, t:56, text:"고무고무 피스톨", color:"#f0a24e" });
  for(let i=0;i<10;i++) spark(p.x, p.y, "#f0a24e");
}

function updateFist(dt){
  if(!fist) return;
  fist.px = fist.x; fist.py = fist.y;
  if(fist.back){
    // 되돌아온다 — 플레이어에게 닿으면 끝
    fist.x += (p.x - fist.x) * 0.24 * dt;
    fist.y += (p.y - fist.y) * 0.24 * dt;
    if(Math.hypot(p.x - fist.x, p.y - fist.y) < 26){ fist = null; return; }
    return;
  }
  fist.x += fist.vx*dt;
  fist.y += fist.vy*dt;
  fist.life -= dt;

  const near = (tx, ty) =>
    distOriginToSeg(fist.px - tx, fist.py - ty, fist.x - tx, fist.y - ty);

  // 날아오는 탄을 쳐낸다
  for(let i=shots.length-1;i>=0;i--){
    if(near(shots[i].x, shots[i].y) < FIST_R + shots[i].r){
      for(let k=0;k<8;k++) spark(shots[i].x, shots[i].y, "#f0a24e");
      shots.splice(i,1);
    }
  }

  // 잡몹
  for(const m of mobs){
    if(m.gone) continue;
    if(m.kind === 0){
      if(near(m.x, m.y) < FIST_R + 15){
        m.gone = true; treasure += 15;
        for(let k=0;k<10;k++) spark(m.x, m.y, "#d9b877");
      }
    } else if(m.h > 30 && m.phase !== 4){
      const top = SEA - m.h;
      if(near(m.x, top - 26) < FIST_R + 74 || near(m.x, (top+SEA)/2) < FIST_R + KING_W){
        m.gone = true;
        treasure += 220;
        pops.push({ x:m.x, y:top - 70, t:120, text:"해왕류를 물리쳤다 +220", color:"#d9b877" });
        for(let k=0;k<30;k++) spark(m.x, top, "#8fd6d8");
        fist.back = true;
      }
    }
  }

  // 보스 — 속도 조건 없이 약점에 그대로 꽂힌다
  if(boss && boss.invul <= 0){
    for(const wp of weakPoints(boss)){
      if(near(wp.x, wp.y) < FIST_R + wp.r){
        damageBoss(true, wp.mark);
        fist.back = true;
        break;
      }
    }
  }

  if(fist && fist.life <= 0) fist.back = true;
}

/* ---------- 고무고무 엘리펀트 건 ---------- */
function fireGun(){
  if(state !== STATE.PLAY || gunCd > 0 || stun > 0) return;
  gunCd = GUN_CD;
  const gx = p.x + 200*p.face, gy = p.y - 6;
  gun = { x:gx, y:gy, t:GUN_LIFE };
  pops.push({ x:p.x, y:p.y-34, t:70, text:"고무고무 엘리펀트 건", color:"#8f4fd0" });
  for(let i=0;i<26;i++) spark(gx, gy, "#8f4fd0");

  for(const m of mobs){
    if(m.gone) continue;
    if(m.kind === 0){
      if(Math.hypot(m.x-gx, m.y-gy) < GUN_R){
        m.gone = true; treasure += 15;
        for(let k=0;k<10;k++) spark(m.x, m.y, "#d9b877");
      }
    } else if(m.h > 20 && m.phase !== 4){
      const top = SEA - m.h;
      if(Math.hypot(m.x-gx, (top-26)-gy) < GUN_R + 74){
        m.gone = true; treasure += 260;
        pops.push({ x:m.x, y:top-70, t:120, text:"해왕류를 물리쳤다 +260", color:"#d9b877" });
        for(let k=0;k<30;k++) spark(m.x, top, "#8fd6d8");
      }
    }
  }
  if(boss && Math.hypot(boss.x-gx, boss.y-gy) < GUN_R + 40){
    damageBoss(true, "엘리펀트 건");
  }
}

function updateGun(dt){
  if(gun){ gun.t -= dt; if(gun.t <= 0) gun = null; }
}

function update(dt){
  if(state === STATE.PAUSE) return;

  time += dt;
  for(let i=bits.length-1;i>=0;i--){
    const b = bits[i];
    b.x += b.vx*dt; b.y += b.vy*dt; b.vy += 0.12*dt; b.life -= 0.02*dt;
    if(b.life <= 0) bits.splice(i,1);
  }
  for(let i=pops.length-1;i>=0;i--){
    pops[i].t -= dt; pops[i].y -= 0.5*dt;
    if(pops[i].t <= 0) pops.splice(i,1);
  }
  if(missAnim){ missAnim.t -= 0.09*dt; if(missAnim.t <= 0) missAnim = null; }

  if(state !== STATE.PLAY) return;

  pPrevX = p.x; pPrevY = p.y;

  // 누르고 있으면 쿨타임이 끝나는 순간 자동으로 걸린다 (입력 선입력)
  if(holding && !rope && grabCd <= 0 && stun <= 0 && pickAnchor()) grab();

  if(rope){
    const dx = rope.a.x - p.x, dy = rope.a.y - p.y;
    const d = Math.hypot(dx, dy) || 1;
    const nx = dx/d, ny = dy/d;              // 팔 방향(플레이어 → 고리)
    const tx = -ny, ty = nx;                 // 접선 방향
    const ext = d - rope.len;

    if(ext > 0){
      // 실제 고무줄처럼 늘어날수록 급격히 뻣뻣해진다
      const f = K1*ext + K2*ext*ext;
      p.vx += nx * f * dt;
      p.vy += ny * f * dt;
      // 감쇠는 '늘었다 줄었다' 하는 성분에만 → 상하 떨림은 빨리 죽고 그네는 살아남는다
      const radial = p.vx*nx + p.vy*ny;
      p.vx -= nx * radial * DAMP * dt;
      p.vy -= ny * radial * DAMP * dt;
    }

    // 그네 펌핑: 힘을 접선 방향으로 준다 (팔 방향으로 밀면 늘어나기만 할 뿐이라)
    let pump = 0;
    if(keys.left)  pump -= 1;
    if(keys.right) pump += 1;
    if(pump){
      const sgn = (tx * pump >= 0) ? 1 : -1;
      p.vx += tx * sgn * PUMP * dt;
      p.vy += ty * sgn * PUMP * dt;
      p.vx += pump * PUMP * 0.35 * dt;       // 조작감을 위한 약간의 직접 조절
    }

    if(keys.down) rope.len = Math.max(46, rope.len - ZIP*dt);
    else if(rope.len > REEL_MIN) rope.len = Math.max(REEL_MIN, rope.len - REEL*dt);
    if(d > REACH*1.7) rope = null;
    airTime = 0;
  } else {
    if(keys.left)  p.vx -= AIR*dt;
    if(keys.right) p.vx += AIR*dt;
    if(keys.down)  p.vy += DIVE*dt;
    airTime += dt;
  }

  p.vy += GRAV*dt;
  p.vx *= Math.pow(0.9996, dt);

  const sp = Math.hypot(p.vx, p.vy);
  if(sp > MAXV){ p.vx = p.vx/sp*MAXV; p.vy = p.vy/sp*MAXV; }

  p.x += p.vx*dt;
  p.y += p.vy*dt;

  // 고무에도 한계가 있다 — 이 이상은 늘어나지 않고 팽팽하게 버틴다
  if(rope){
    const dx2 = rope.a.x - p.x, dy2 = rope.a.y - p.y;
    const d2 = Math.hypot(dx2, dy2) || 1;
    const maxD = rope.len * STRETCH;
    if(d2 > maxD){
      const nx2 = dx2/d2, ny2 = dy2/d2;
      p.x = rope.a.x - nx2*maxD;
      p.y = rope.a.y - ny2*maxD;
      const radial = p.vx*nx2 + p.vy*ny2;
      if(radial < 0){ p.vx -= nx2*radial; p.vy -= ny2*radial; }   // 멀어지는 성분만 제거
    }
  }

  if(p.vx > 0.3) p.face = 1; else if(p.vx < -0.3) p.face = -1;
  if(p.y < -220){ p.y = -220; p.vy = Math.abs(p.vy)*0.35; }

  dist = Math.max(dist, p.x / 22);

  for(const c of coins){
    if(c.got) continue;
    if(Math.hypot(c.x - p.x, c.y - p.y) < 27){
      c.got = true;
      treasure += 25;
      p.vx += 1.0 * (p.vx >= 0 ? 1 : -1);
      for(let i=0;i<9;i++) spark(c.x, c.y, "#d9b877");
    }
  }

  if(stun > 0) stun -= dt;
  if(iframes > 0) iframes -= dt;
  if(grabCd > 0) grabCd -= dt;
  if(!boss){
    if(dist >= nextBigAt) spawnBoss(true);
    else if(dist >= nextBossAt && dist + 220 < nextBigAt) spawnBoss(false);
  }
  if(boss) updateBoss(dt);
  updateShots(dt);
  if(skillCd > 0) skillCd -= dt;
  if(gunCd > 0) gunCd -= dt;
  updateFist(dt);
  updateGun(dt);
  updateMobs(dt);
  if(state !== STATE.PLAY) return;

  cam.x += ((p.x - W*0.32) - cam.x) * 0.13 * dt;
  if(cam.x < 0) cam.x = 0;
  cam.z += ((1 - Math.min(0.11, sp/250)) - cam.z) * 0.05 * dt;
  generate();
  syncHUD();

  if(p.y > SEA - 14) return die("바다");
  if(p.x < cam.x - 50) return die("뒤처짐");
}

/* ---------- 저장 ---------- */
async function loadBest(){
  try{
    if(window.storage){
      const r = await window.storage.get("swing:best");
      if(r && r.value){ best = parseFloat(r.value) || 0; syncHUD(); return; }
    }
  }catch(e){}
  try{                                     // 파일로 직접 열었을 때
    const v = window.localStorage && localStorage.getItem("swing:best");
    if(v){ best = parseFloat(v) || 0; syncHUD(); }
  }catch(e){}
}
async function saveBest(){
  const v = String(Math.floor(best));
  try{ if(window.storage){ await window.storage.set("swing:best", v); return; } }catch(e){}
  try{ if(window.localStorage) localStorage.setItem("swing:best", v); }catch(e){}
}

/* ---------- 그리기 ---------- */
function hash(i){ const s = Math.sin(i*12.9898)*43758.5453; return s - Math.floor(s); }

function sky(){
  const g = ctx.createLinearGradient(0, 0, 0, SEA);
  g.addColorStop(0,    "#101a30");
  g.addColorStop(0.40, "#3d2a4a");
  g.addColorStop(0.72, "#a8515a");
  g.addColorStop(1,    "#f0a24e");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 해
  ctx.fillStyle = "rgba(255,220,160,0.85)";
  ctx.beginPath();
  ctx.arc(W*0.78 - (cam.x*0.012) % (W*2.2), SEA - 60, 40, 0, Math.PI*2);
  ctx.fill();

  // 구름
  ctx.fillStyle = "rgba(40,26,44,0.35)";
  const co = (cam.x*0.07) % 380;
  for(let i=-1;i<W/380+2;i++){
    const bx = i*380 - co, idx = Math.floor((cam.x*0.07 + i*380)/380);
    const by = 50 + hash(idx)*90;
    ctx.beginPath();
    ctx.ellipse(bx+90, by, 96, 15, 0, 0, Math.PI*2);
    ctx.ellipse(bx+150, by-12, 60, 12, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // 먼 섬
  ctx.fillStyle = "rgba(22,18,38,0.5)";
  const off = (cam.x*0.13) % 560;
  for(let i=-1;i<3;i++){
    const bx = i*560 - off + 80;
    ctx.beginPath();
    ctx.moveTo(bx, SEA);
    ctx.lineTo(bx+70, SEA-72);
    ctx.lineTo(bx+118, SEA-38);
    ctx.lineTo(bx+172, SEA-96);
    ctx.lineTo(bx+244, SEA);
    ctx.closePath(); ctx.fill();
  }

  // 갈매기
  ctx.strokeStyle = "rgba(244,236,217,0.4)";
  ctx.lineWidth = 2;
  const go = (cam.x*0.20) % 700;
  for(let i=0;i<5;i++){
    const gx = (i*180 - go + 900) % 1100 - 100;
    const gy = 70 + hash(i*7)*90 + Math.sin(time*0.02 + i)*6;
    const s = 6 + hash(i)*4;
    ctx.beginPath();
    ctx.moveTo(gx-s, gy); ctx.quadraticCurveTo(gx, gy-s*0.7, gx+s, gy);
    ctx.stroke();
  }
}

function sea(){
  // 빠르게 달릴 땐 cam.z가 살짝 줄어드는데, 이 사각형이 그 축소 변환 안에서
  // 그려지다 보니 화면 가장자리가 안쪽으로 말려들어가 하늘이 비쳐 보였다.
  // 화면 경계보다 넉넉히 크게 그려서 축소돼도 항상 끝까지 덮게 한다.
  const MX = 200, MYB = 220;
  const g = ctx.createLinearGradient(0, SEA, 0, H);
  g.addColorStop(0, "#17505d");
  g.addColorStop(1, "#08202c");
  ctx.fillStyle = g;
  ctx.fillRect(-MX, SEA, W + MX*2, (H-SEA) + MYB);

  ctx.strokeStyle = "rgba(180,230,230,0.18)";
  ctx.lineWidth = 2;
  for(let r=0;r<4;r++){
    const y = SEA + 13 + r*15;
    const off = (cam.x*(0.5+r*0.18) + time*(0.6+r*0.3)) % 140;
    ctx.beginPath();
    for(let x=-140-MX; x<W+140+MX; x+=140){
      ctx.moveTo(x-off, y); ctx.lineTo(x-off+50, y);
    }
    ctx.stroke();
  }
}

function drawMast(a, active){
  const x = a.x - cam.x;
  if(x < -170 || x > W+170) return;
  const bob = Math.sin(time*0.026 + a.x*0.01)*3;
  const y = a.y + bob;

  if(a.kind === 0){
    // 배 한 척 + 돛대
    const deck = SEA - 12 + Math.sin(time*0.03 + a.x*0.008)*3;
    ctx.fillStyle = "#3b2417";
    ctx.beginPath();
    ctx.moveTo(x-74, deck-16);
    ctx.lineTo(x+74, deck-16);
    ctx.lineTo(x+54, deck+22);
    ctx.lineTo(x-58, deck+22);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#54331f";
    ctx.fillRect(x-74, deck-20, 148, 6);
    ctx.fillStyle = "#d9b877";
    for(let i=-2;i<=2;i++) ctx.fillRect(x+i*24-4, deck-8, 8, 8);

    // 돛대
    ctx.fillStyle = "#6b4426";
    ctx.fillRect(x-4, y, 8, deck-16-y);
    // 가로 활대와 접힌 돛
    const yardY = y + 46;
    ctx.fillStyle = "#6b4426";
    ctx.fillRect(x-46, yardY, 92, 5);
    ctx.fillStyle = "#efe2c4";
    ctx.beginPath();
    ctx.moveTo(x-42, yardY+5);
    ctx.quadraticCurveTo(x, yardY+58, x+42, yardY+5);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(60,40,26,0.35)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x-20, yardY+6); ctx.lineTo(x-16, yardY+40);
    ctx.moveTo(x+20, yardY+6); ctx.lineTo(x+16, yardY+40); ctx.stroke();

    // 깃발
    ctx.fillStyle = "#1b1218";
    const fw = 34 + Math.sin(time*0.09 + a.x)*4;
    ctx.beginPath();
    ctx.moveTo(x+4, y+4);
    ctx.lineTo(x+4+fw, y+11);
    ctx.lineTo(x+4, y+22);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#efe2c4";
    ctx.beginPath(); ctx.arc(x+17, y+12, 3.4, 0, Math.PI*2); ctx.fill();
  } else {
    // 바위 기둥
    ctx.fillStyle = "#241f2e";
    ctx.beginPath();
    ctx.moveTo(x-16, y+6);
    ctx.lineTo(x+18, y+10);
    ctx.lineTo(x+34, SEA+6);
    ctx.lineTo(x-32, SEA+6);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#332b40";
    ctx.beginPath();
    ctx.moveTo(x-16, y+6); ctx.lineTo(x+4, y+9); ctx.lineTo(x+8, SEA+6); ctx.lineTo(x-32, SEA+6);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#6b4426"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, y+8); ctx.lineTo(x, y); ctx.stroke();
  }

  // 걸 수 있는 밧줄 고리
  if(a.cut){
    ctx.strokeStyle = "#b03a34"; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(x-9, y-9); ctx.lineTo(x+9, y+9);
    ctx.moveTo(x+9, y-9); ctx.lineTo(x-9, y+9);
    ctx.stroke();
    a.drawY = y;
    return;
  }
  ctx.strokeStyle = active ? "#ffe7ae" : "#d9b877";
  ctx.lineWidth = active ? 6 : 5;
  ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI*2); ctx.stroke();
  if(active){
    ctx.strokeStyle = "rgba(240,162,78,0.5)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 20 + Math.sin(time*0.12)*2.5, 0, Math.PI*2); ctx.stroke();
  }
  a.drawY = y;
}

function drawCoin(c){
  const x = c.x - cam.x;
  if(c.got || x < -40 || x > W+40) return;
  const y = c.y + Math.sin(time*0.05 + c.x*0.02)*4;
  const squash = Math.abs(Math.cos(time*0.04 + c.x));
  ctx.fillStyle = "#d9b877";
  ctx.beginPath(); ctx.ellipse(x, y, 4 + squash*7, 11, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = "#8a6a2c"; ctx.lineWidth = 2; ctx.stroke();
}

function drawArm(sx, sy, tx, ty, taut){
  const mx = (sx+tx)/2, my = (sy+ty)/2;
  const dx = tx-sx, dy = ty-sy;
  const len = Math.hypot(dx,dy) || 1;
  const sag = Math.max(0, 30 - len*0.09) * (taut ? 0.35 : 1);
  const cx = mx - dy/len*sag*0.4, cy = my + sag;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#1b1218";
  ctx.lineWidth = Math.max(3.4, 10 - len*0.016);
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(cx, cy, tx, ty); ctx.stroke();
  ctx.strokeStyle = "#e8b48c";
  ctx.lineWidth = Math.max(2.1, 7.2 - len*0.015);
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(cx, cy, tx, ty); ctx.stroke();
  ctx.fillStyle = "#e8b48c";
  ctx.beginPath(); ctx.arc(tx, ty, 6.5, 0, Math.PI*2); ctx.fill();
}

function drawPlayer(){
  const x = p.x - cam.x, y = p.y;
  const lean = Math.max(-0.75, Math.min(0.75, p.vx*0.035 + p.vy*0.012));
  const diving = keys.down && !rope;

  // 코트 자락
  ctx.fillStyle = "#7a2f2b";
  ctx.beginPath();
  ctx.moveTo(x-2, y-2);
  ctx.quadraticCurveTo(x - p.vx*2.4, y + 2 - p.vy*0.8, x - p.vx*3.8, y + 12 - p.vy*1.2);
  ctx.quadraticCurveTo(x - p.vx*2.0, y + 12 - p.vy*0.6, x+4, y+8);
  ctx.closePath(); ctx.fill();

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(lean);
  ctx.fillStyle = "#1b1218";
  ctx.beginPath(); ctx.ellipse(0, 4, 12, diving ? 17 : 15, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#e8ddc6";
  ctx.beginPath(); ctx.ellipse(0, 4, 9.5, diving ? 14.5 : 12.5, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#b03a34";                     // 허리띠
  ctx.fillRect(-9.5, 6, 19, 5);

  ctx.fillStyle = "#e8b48c";                     // 머리
  ctx.beginPath(); ctx.arc(0, -11, 9.2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#b03a34";                     // 두건
  ctx.beginPath();
  ctx.arc(0, -13, 9.4, Math.PI, 0);
  ctx.lineTo(9.4, -11); ctx.lineTo(-9.4, -11);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-8, -12);
  ctx.quadraticCurveTo(-15 - Math.sin(time*0.14)*3, -10, -17, -3);
  ctx.lineTo(-9, -8); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#1b1218";
  ctx.beginPath(); ctx.arc(3.4*p.face, -11, 1.9, 0, Math.PI*2); ctx.fill();

  ctx.strokeStyle = "#2f2436"; ctx.lineWidth = 5;
  const kick = Math.sin(time*0.13)*3;
  ctx.beginPath();
  if(diving){
    ctx.moveTo(-4, 16); ctx.lineTo(-5, 27);
    ctx.moveTo(4, 16);  ctx.lineTo(5, 27);
  } else {
    ctx.moveTo(-4, 15); ctx.lineTo(-6 - p.vx*0.22, 24 + kick);
    ctx.moveTo(4, 15);  ctx.lineTo(2 - p.vx*0.22, 25 - kick);
  }
  ctx.stroke();
  ctx.restore();
}

function drawShots(){
  for(const q of shots){
    const x = q.x - cam.x;
    ctx.save();
    ctx.translate(x, q.y);
    if(q.kind === 0){
      ctx.rotate(q.spin);
      ctx.fillStyle = "#c9c2b4";
      ctx.beginPath();
      ctx.moveTo(-11,0); ctx.lineTo(0,-4.5); ctx.lineTo(12,0); ctx.lineTo(0,4.5);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#b03a34";
      ctx.fillRect(-11, -2.6, 6, 5.2);
    } else {
      ctx.fillStyle = "#1b1218";
      ctx.beginPath(); ctx.arc(0,0,11,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = "rgba(240,162,78,0.55)";
      ctx.beginPath(); ctx.arc(-3,-3,4,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

function drawBoss(){
  const b = boss, x = b.x - cam.x;
  const hurt = b.flash > 0 && Math.floor(b.flash/3)%2 === 0;
  const ink = hurt ? "#f4ecd9" : "#1b1218";

  if(b.type === 0){
    // 줄무늬 기구에 매달린 곡예사
    const bx = Math.sin(b.t*0.045)*30;          // 기구
    const sw = b.swing;                          // 그 아래 매달린 곡예사
    ctx.save();
    ctx.translate(x + bx, b.y);
    ctx.fillStyle = hurt ? "#f4ecd9" : "#b03a34";
    ctx.beginPath(); ctx.ellipse(0, -58, 34, 42, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = hurt ? "#d9b877" : "#efe2c4";
    for(let i=-1;i<=1;i++){
      ctx.beginPath();
      ctx.ellipse(i*20, -58, 6, 41, 0, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
    ctx.save();
    ctx.translate(x, b.y);
    ctx.strokeStyle = "#6b4426"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(bx-16,-30); ctx.lineTo(sw-9,-4); ctx.moveTo(bx+16,-30); ctx.lineTo(sw+9,-4);
    ctx.stroke();
    ctx.translate(sw, 0);
    ctx.fillStyle = "#54331f";
    ctx.fillRect(-16, -4, 32, 14);
    // 곡예사
    ctx.fillStyle = ink;
    ctx.beginPath(); ctx.ellipse(0, -12, 10, 12, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#e8b48c";
    ctx.beginPath(); ctx.arc(0, -26, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#b03a34";
    ctx.beginPath(); ctx.arc(0, -25, 3.2, 0, Math.PI*2); ctx.fill();   // 붉은 코
    ctx.fillStyle = "#d9b877";                                          // 뾰족 모자
    ctx.beginPath();
    ctx.moveTo(-9,-31); ctx.lineTo(0,-48); ctx.lineTo(9,-31);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  } else if(b.type === 1){
    // 물속 그림자 / 솟구친 작살잡이
    if(!b.air){
      ctx.fillStyle = "rgba(11,32,42,0.75)";
      ctx.beginPath();
      ctx.ellipse(x, SEA + 22, 62, 16, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#0d2a36";
      ctx.beginPath();
      ctx.moveTo(x-14, SEA+6); ctx.lineTo(x, SEA-26); ctx.lineTo(x+16, SEA+6);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.save();
      ctx.translate(x, b.y);
      ctx.rotate(Math.max(-0.6, Math.min(0.6, b.vy*0.05)));
      ctx.fillStyle = hurt ? "#f4ecd9" : "#2f5f6b";
      ctx.beginPath(); ctx.ellipse(0, 0, 26, 40, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = hurt ? "#d9b877" : "#1d4048";
      ctx.beginPath();                                  // 등지느러미
      ctx.moveTo(-6,-34); ctx.lineTo(-30,-6); ctx.lineTo(-8,4);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#efe2c4";                        // 이빨
      for(let i=-2;i<=2;i++){
        ctx.beginPath();
        ctx.moveTo(i*7-3, -14); ctx.lineTo(i*7, -5); ctx.lineTo(i*7+3, -14);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = "#b03a34";
      ctx.beginPath(); ctx.arc(9, -24, 3.4, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = "#6b4426"; ctx.lineWidth = 4;   // 작살
      ctx.beginPath(); ctx.moveTo(14, 6); ctx.lineTo(46, -18); ctx.stroke();
      ctx.fillStyle = "#c9c2b4";
      ctx.beginPath();
      ctx.moveTo(46,-18); ctx.lineTo(58,-26); ctx.lineTo(48,-10);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  } else if(b.type === 2){
    // 포함 — 잠항하면 통째로 가라앉는다
    const sk = b.sink || 0;
    if(sk > 6){
      // 물살 자국
      ctx.strokeStyle = "rgba(143,214,216," + Math.min(0.5, sk/200).toFixed(2) + ")";
      ctx.lineWidth = 3;
      for(let i=-2;i<=2;i++){
        ctx.beginPath();
        ctx.moveTo(x + i*46 - 40, SEA + 4 + Math.sin(time*0.1 + i)*3);
        ctx.lineTo(x + i*46 + 26, SEA + 4 + Math.sin(time*0.1 + i)*3);
        ctx.stroke();
      }
    }
    ctx.save();
    ctx.translate(0, sk);
    const deck = SEA - 6;
    ctx.fillStyle = hurt ? "#f4ecd9" : "#2a1a14";
    ctx.beginPath();
    ctx.moveTo(x-104, deck-22); ctx.lineTo(x+104, deck-22);
    ctx.lineTo(x+78, deck+26); ctx.lineTo(x-86, deck+26);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#1b1218";
    for(let i=-2;i<=2;i++) ctx.fillRect(x+i*34-8, deck-16, 16, 11);
    ctx.fillStyle = "#6b4426";
    ctx.fillRect(x-5, SEA-160, 10, 138);
    ctx.fillStyle = "#4a3020";
    ctx.fillRect(x-58, SEA-118, 116, 6);
    ctx.fillStyle = "#2a1a14";
    ctx.beginPath();
    ctx.moveTo(x-54, SEA-112); ctx.quadraticCurveTo(x, SEA-58, x+54, SEA-112);
    ctx.closePath(); ctx.fill();
    // 화약통 (약점) — 도르래로 오르내린다
    const wp = SEA - 152 + Math.sin(b.t*0.022)*46;
    ctx.strokeStyle = "#6b4426"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, SEA-158); ctx.lineTo(x, wp); ctx.stroke();
    const barrel = (bxx, byy, rw, rh) => {
      ctx.fillStyle = hurt ? "#f4ecd9" : "#8a5a2c";
      ctx.beginPath(); ctx.ellipse(bxx, byy, rw, rh, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = "#d9b877"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(bxx-rw+1, byy-6); ctx.lineTo(bxx+rw-1, byy-6);
      ctx.moveTo(bxx-rw+1, byy+6); ctx.lineTo(bxx+rw-1, byy+6); ctx.stroke();
    };
    barrel(x, wp, 17, 20);
    barrel(x - 74, SEA - 42, 14, 17);          // 갑판 뒤 예비통
    ctx.restore();

  } else if(b.type === 3){
    // 밧줄 끊는 자 — 고리 위에 웅크리고 앉아 칼을 든다
    ctx.save();
    ctx.translate(x, b.y);
    ctx.fillStyle = hurt ? "#f4ecd9" : "#2b2430";
    ctx.beginPath(); ctx.ellipse(0, 2, 11, 13, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#e8b48c";
    ctx.beginPath(); ctx.arc(0, -14, 8.4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#1b1218";                    // 두건과 복면
    ctx.beginPath(); ctx.arc(0, -16, 8.6, Math.PI, 0); ctx.lineTo(8.6,-13); ctx.lineTo(-8.6,-13);
    ctx.closePath(); ctx.fill();
    ctx.fillRect(-8.4, -12, 16.8, 4);
    ctx.strokeStyle = "#c9c2b4"; ctx.lineWidth = 3;   // 단도
    ctx.beginPath(); ctx.moveTo(8, 2); ctx.lineTo(24, -8); ctx.stroke();
    ctx.strokeStyle = "#2f2436"; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-5, 12); ctx.lineTo(-7, 22); ctx.moveTo(5, 12); ctx.lineTo(7, 22);
    ctx.stroke();
    // 아래로 늘어뜨린 밧줄 — 끝의 갈고리도 약점
    const sway = Math.sin(b.t*0.06)*22;
    ctx.strokeStyle = "#6b4426"; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, 14); ctx.quadraticCurveTo(sway*0.5, 46, sway, 78); ctx.stroke();
    ctx.fillStyle = hurt ? "#f4ecd9" : "#c9c2b4";
    ctx.beginPath(); ctx.arc(sway, 78, 9, 0, Math.PI*2); ctx.fill();
    ctx.restore();

  } else {
    // 크라켄
    const sub = b.phase === 1;
    for(const tt of b.tents){
      const tx2 = tt.x - cam.x;
      if(tx2 < -160 || tx2 > W+160 || tt.h < 4) continue;
      const top = SEA - tt.h;
      const wob = Math.sin(time*0.08 + tt.x*0.02)*10;
      ctx.strokeStyle = "#5a2f6b";
      ctx.lineCap = "round";
      ctx.lineWidth = 26;
      ctx.beginPath();
      ctx.moveTo(tx2, SEA + 14);
      ctx.quadraticCurveTo(tx2 + wob, (SEA+top)/2, tx2 + wob*1.6, top);
      ctx.stroke();
      ctx.strokeStyle = "#8f4fd0"; ctx.lineWidth = 9;
      ctx.beginPath();
      ctx.moveTo(tx2, SEA + 14);
      ctx.quadraticCurveTo(tx2 + wob, (SEA+top)/2, tx2 + wob*1.6, top);
      ctx.stroke();
      ctx.fillStyle = "#d9a8f0";
      for(let k=1;k<5;k++){
        const f = k/5, yy = SEA - tt.h*f;
        ctx.beginPath(); ctx.arc(tx2 + wob*f*1.4 - 9, yy, 3.4, 0, Math.PI*2); ctx.fill();
      }
    }

    ctx.fillStyle = hurt ? "#f4ecd9" : (sub ? "#3d2150" : "#5a2f6b");
    ctx.beginPath(); ctx.ellipse(x, b.y, 92, 62, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = hurt ? "#d9b877" : "#4a2758";
    ctx.beginPath(); ctx.ellipse(x, b.y - 40, 62, 54, 0, 0, Math.PI*2); ctx.fill();
    if(!sub){
      const ey = b.y - 74, ex = x + Math.sin(b.t*0.035)*34;   // 눈이 두리번거린다
      ctx.fillStyle = "#f6e7a8";
      ctx.beginPath(); ctx.ellipse(ex, ey, 26, 20, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#1b1218";
      ctx.beginPath(); ctx.ellipse(ex + 4, ey, 9, 15, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = "rgba(143,79,208," + (0.4 + Math.sin(time*0.14)*0.25).toFixed(2) + ")";
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(ex, ey, 40 + Math.sin(time*0.14)*4, 0, Math.PI*2); ctx.stroke();
    } else if((b.t % 150) < 62){
      // 잠수 중에도 숨구멍이 열린다 — 이때만 반격할 틈이 있다
      const hx = x + 40, hy = SEA - 26;
      ctx.fillStyle = "#3d2150";
      ctx.beginPath(); ctx.ellipse(hx, hy, 26, 16, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#d9a8f0";
      ctx.beginPath(); ctx.ellipse(hx, hy, 13, 8, 0, 0, Math.PI*2); ctx.fill();
      if(Math.random() < 0.2) spark(hx + (Math.random()-0.5)*30, hy, "#d9a8f0");
    }
  }

  // 약점 표시
  for(const wpt of weakPoints(b)){
    ctx.strokeStyle = "rgba(240,162,78," + (b.invul > 0 ? 0.2 : 0.5) + ")";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(wpt.x - cam.x, wpt.y, wpt.r + 8 + Math.sin(time*0.12)*3, 0, Math.PI*2);
    ctx.stroke();
  }
}

function drawMobs(){
  for(const m of mobs){
    const x = m.x - cam.x;
    if(x < -260 || x > W + 260) continue;

    if(m.kind === 0){
      /* 식인 물고기 */
      if(!m.air){
        ctx.fillStyle = "rgba(11,32,42,0.6)";
        ctx.beginPath(); ctx.ellipse(x, m.y + 6, 20, 7, 0, 0, Math.PI*2); ctx.fill();
      }
      ctx.save();
      ctx.translate(x, m.y);
      ctx.rotate(m.air ? Math.max(-0.9, Math.min(0.9, m.vy*0.06)) : Math.sin(m.t*0.06)*0.12);
      ctx.fillStyle = "#3f6b52";
      ctx.beginPath(); ctx.ellipse(0, 0, 17, 10, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#2b4d3a";
      ctx.beginPath();
      ctx.moveTo(13, -2); ctx.lineTo(26, -10); ctx.lineTo(24, 8);      // 꼬리
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#efe2c4";                                        // 이빨
      for(let i=0;i<4;i++){
        ctx.beginPath();
        ctx.moveTo(-16 + i*4, 1); ctx.lineTo(-14 + i*4, 6); ctx.lineTo(-12 + i*4, 1);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = "#b03a34";
      ctx.beginPath(); ctx.arc(-8, -3, 2.6, 0, Math.PI*2); ctx.fill();
      ctx.restore();

    } else {
      /* 해왕류 */
      if(m.phase <= 1){
        ctx.fillStyle = "rgba(11,32,42,0.78)";
        ctx.beginPath(); ctx.ellipse(x, SEA + 46, 96, 26, 0, 0, Math.PI*2); ctx.fill();
      }
      if(m.phase === 1){
        const a = 0.35 + Math.sin(time*0.3)*0.3;
        ctx.strokeStyle = "rgba(176,58,52," + a.toFixed(2) + ")";
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(x, SEA + 6, 60, Math.PI, 0); ctx.stroke();
        ctx.fillStyle = "rgba(176,58,52,.9)";
        ctx.textAlign = "center";
        ctx.font = "700 15px 'Pretendard', system-ui, sans-serif";
        ctx.fillText("해왕류", x, SEA - 16);
      }
      if(m.h > 4){
        const top = SEA - m.h;
        // 목
        ctx.strokeStyle = "#243f4e"; ctx.lineCap = "round"; ctx.lineWidth = KING_W*2;
        ctx.beginPath(); ctx.moveTo(x, SEA + 30); ctx.lineTo(x, top); ctx.stroke();
        ctx.strokeStyle = "#2f5f6b"; ctx.lineWidth = KING_W*1.4;
        ctx.beginPath(); ctx.moveTo(x, SEA + 30); ctx.lineTo(x, top); ctx.stroke();
        // 배 쪽 무늬
        ctx.fillStyle = "#8fd6d8";
        for(let k=1;k<6;k++){
          const yy = SEA - m.h*(k/6);
          ctx.globalAlpha = 0.35;
          ctx.beginPath(); ctx.ellipse(x - KING_W*0.5, yy, 9, 5, 0, 0, Math.PI*2); ctx.fill();
          ctx.globalAlpha = 1;
        }
        // 머리
        ctx.fillStyle = "#2f5f6b";
        ctx.beginPath(); ctx.ellipse(x, top - 26, 74, 56, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#1d4048";
        ctx.beginPath();
        ctx.moveTo(x - 18, top - 74); ctx.lineTo(x + 4, top - 116); ctx.lineTo(x + 20, top - 66);
        ctx.closePath(); ctx.fill();                                    // 뿔
        ctx.fillStyle = "#f6e7a8";
        ctx.beginPath(); ctx.ellipse(x - 30, top - 40, 15, 12, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x + 30, top - 40, 15, 12, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#1b1218";
        ctx.beginPath(); ctx.ellipse(x - 30, top - 40, 5, 11, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x + 30, top - 40, 5, 11, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#efe2c4";                                      // 이빨
        for(let i=-3;i<=3;i++){
          ctx.beginPath();
          ctx.moveTo(x + i*17 - 6, top + 4); ctx.lineTo(x + i*17, top + 22); ctx.lineTo(x + i*17 + 6, top + 4);
          ctx.closePath(); ctx.fill();
        }
      }
    }
  }
}

function drawFist(){
  if(!fist) return;
  const fx = fist.x - cam.x, fy = fist.y;
  const sx = p.x - cam.x + 4*p.face, sy = p.y - 2;
  ctx.strokeStyle = "#e8b48c"; ctx.lineCap = "round"; ctx.lineWidth = 11;
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(fx, fy); ctx.stroke();
  ctx.strokeStyle = "rgba(240,162,78,.55)"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(fx, fy); ctx.stroke();
  ctx.fillStyle = "#e8b48c";
  ctx.beginPath(); ctx.arc(fx, fy, FIST_R, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = "#b03a34"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(fx, fy, FIST_R - 5, 0, Math.PI*2); ctx.stroke();
}

function drawGun(){
  if(!gun) return;
  const k = 1 - Math.max(0, gun.t) / GUN_LIFE;
  const gx = gun.x - cam.x, gy = gun.y;
  const r = GUN_R * Math.min(1, k*2.4);
  ctx.save();
  ctx.globalAlpha = Math.max(0, gun.t / GUN_LIFE);
  ctx.strokeStyle = "#8f4fd0"; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.arc(gx, gy, r, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = "rgba(143,79,208,0.26)";
  ctx.beginPath(); ctx.arc(gx, gy, r*0.68, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawSkillGauge(){
  const cx = 46, cy = H - 46, r = 21;
  const ready = skillCd <= 0;
  ctx.save();
  ctx.fillStyle = ready ? "rgba(240,162,78,.22)" : "rgba(13,27,38,.55)";
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = ready ? "rgba(240,162,78,.95)" : "rgba(217,184,119,.30)";
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
  if(!ready){
    ctx.strokeStyle = "rgba(217,184,119,.8)";
    ctx.beginPath();
    ctx.arc(cx, cy, r, -Math.PI/2, -Math.PI/2 + Math.PI*2*(1 - skillCd/SKILL_CD));
    ctx.stroke();
  }
  ctx.textAlign = "center";
  ctx.fillStyle = ready ? "#f0a24e" : "rgba(244,236,217,.6)";
  ctx.font = "700 11px 'Pretendard', system-ui, sans-serif";
  ctx.fillText(ready ? "F" : Math.ceil(skillCd/60) + "초", cx, cy + 4);
  ctx.fillStyle = "rgba(244,236,217,.5)";
  ctx.font = "400 10px 'Pretendard', system-ui, sans-serif";
  ctx.fillText("피스톨", cx, cy + r + 13);
  ctx.restore();
}

function drawGunGauge(){
  const cx = 46, cy = H - 100, r = 21;
  const ready = gunCd <= 0;
  ctx.save();
  ctx.fillStyle = ready ? "rgba(143,79,208,.22)" : "rgba(13,27,38,.55)";
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = ready ? "rgba(143,79,208,.95)" : "rgba(217,184,119,.30)";
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
  if(!ready){
    ctx.strokeStyle = "rgba(217,184,119,.8)";
    ctx.beginPath();
    ctx.arc(cx, cy, r, -Math.PI/2, -Math.PI/2 + Math.PI*2*(1 - gunCd/GUN_CD));
    ctx.stroke();
  }
  ctx.textAlign = "center";
  ctx.fillStyle = ready ? "#d9a8f0" : "rgba(244,236,217,.6)";
  ctx.font = "700 11px 'Pretendard', system-ui, sans-serif";
  ctx.fillText(ready ? "G" : Math.ceil(gunCd/60) + "초", cx, cy + 4);
  ctx.fillStyle = "rgba(244,236,217,.5)";
  ctx.font = "400 10px 'Pretendard', system-ui, sans-serif";
  ctx.fillText("건", cx, cy + r + 13);
  ctx.restore();
}

function drawBossBar(){
  const b = boss;
  const bw = 300, bx = (W-bw)/2, by = 22;
  ctx.fillStyle = "rgba(13,27,38,0.72)";
  ctx.fillRect(bx-10, by-16, bw+20, 40);
  ctx.fillStyle = "rgba(244,236,217,0.18)";
  ctx.fillRect(bx, by, bw, 9);
  ctx.fillStyle = b.big ? "#8f4fd0" : "#b03a34";
  ctx.fillRect(bx, by, bw * Math.max(0, b.hp/b.maxHp), 9);
  ctx.strokeStyle = "rgba(244,236,217,0.25)"; ctx.lineWidth = 1;
  for(let i=1;i<b.maxHp;i++){
    const sx2 = bx + bw*i/b.maxHp;
    ctx.beginPath(); ctx.moveTo(sx2, by); ctx.lineTo(sx2, by+9); ctx.stroke();
  }
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "700 14px 'Pretendard', system-ui, sans-serif";
  ctx.fillStyle = "#f4ecd9";
  ctx.fillStyle = b.big ? "#d9a8f0" : "#f4ecd9";
  ctx.fillText((b.big ? "▲ " : "") + BOSSES[b.type].name + (b.big && b.hp <= 3 ? "  — 격노" : ""), W/2, by - 7);
  ctx.font = "400 11px 'Pretendard', system-ui, sans-serif";
  ctx.fillStyle = "rgba(244,236,217,.6)";
  ctx.fillText(BOSSES[b.type].tag + " · 속도 32 이상으로 부딪쳐라", W/2, by + 20);
}

function centerText(t, y, font, color, alpha){
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = font; ctx.fillStyle = color;
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillText(t, W/2, y);
  ctx.globalAlpha = 1;
}

function draw(){
  sky();

  ctx.save();
  ctx.translate(W*0.32, H*0.5);
  ctx.scale(cam.z, cam.z);
  ctx.translate(-W*0.32, -H*0.5);

  let target = null;
  if(state === STATE.PLAY && !rope) target = pickAnchor();

  for(const a of anchors) drawMast(a, a === target || (rope && rope.a === a));
  for(const c of coins) drawCoin(c);

  const shx = p.x - cam.x + 4*p.face, shy = p.y - 2;
  if(rope){
    const d = Math.hypot(rope.a.x-p.x, rope.a.y-p.y);
    drawArm(shx, shy, rope.a.x - cam.x, rope.a.drawY || rope.a.y, d > rope.len);
  } else if(missAnim){
    const t2 = missAnim.t;
    drawArm(shx, shy, shx + (missAnim.x-p.x)*t2, shy + (missAnim.y-p.y)*t2, false);
  }
  if(boss) drawBoss();
  drawMobs();
  drawShots();
  drawPlayer();
  drawFist();
  drawGun();

  // 팔 재사용 대기 표시
  if(state === STATE.PLAY && grabCd > 0){
    ctx.strokeStyle = "rgba(217,184,119,0.6)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(p.x - cam.x, p.y, 25, -Math.PI/2, -Math.PI/2 + Math.PI*2*(1 - grabCd/GRAB_CD));
    ctx.stroke();
  }

  for(const b of bits){
    ctx.globalAlpha = Math.max(0, b.life);
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x - cam.x - 2, b.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
  for(const q of pops){
    ctx.globalAlpha = Math.min(1, q.t/30);
    ctx.textAlign = "center";
    ctx.font = "700 17px ui-monospace, Menlo, monospace";
    ctx.fillStyle = q.color;
    ctx.fillText(q.text, q.x - cam.x, q.y);
    ctx.globalAlpha = 1;
  }

  sea();
  ctx.restore();

  if(boss && state === STATE.PLAY) drawBossBar();
  if(state === STATE.PLAY) drawSkillGauge();
  if(state === STATE.PLAY) drawGunGauge();

  if(stun > 0 && state === STATE.PLAY){
    ctx.fillStyle = "rgba(176,58,52," + (0.10 + Math.sin(time*0.5)*0.05).toFixed(2) + ")";
    ctx.fillRect(0,0,W,H);
  }

  if(state === STATE.PLAY && !rope && airTime > 34){
    ctx.globalAlpha = 0.78;
    centerText("체공 " + (airTime/60).toFixed(1) + "초", 34, "600 15px 'Pretendard', system-ui, sans-serif", "#d9b877");
    ctx.globalAlpha = 1;
  }
  if(chain > 1 && state === STATE.PLAY){
    ctx.globalAlpha = 0.82;
    centerText("연속 ×" + Math.min(4, chain), 60, "700 19px ui-monospace, Menlo, monospace", "#f0a24e");
    ctx.globalAlpha = 1;
  }

  if(state === STATE.PAUSE){
    ctx.fillStyle = "rgba(13,27,38,0.74)";
    ctx.fillRect(0,0,W,H);
    centerText("닻을 내렸다", H/2 - 26, "700 30px 'Pretendard', system-ui, sans-serif", "#f4ecd9");
    centerText("P · Esc · Space · 화면을 눌러 계속", H/2 + 16, "400 14px 'Pretendard', system-ui, sans-serif", "rgba(244,236,217,.62)");
  } else if(state === STATE.READY){
    ctx.fillStyle = "rgba(13,27,38,0.66)";
    ctx.fillRect(0,0,W,H);
    centerText("팔을 뻗어 돛대 밧줄을 잡는다", H/2 - 54, "700 27px 'Pretendard', system-ui, sans-serif", "#f4ecd9");
    centerText("← → 로 그네를 밀어 속도를 올리고, ↓ 로 줄을 감아 돛대 위로 오른다", H/2 - 16, "400 15px 'Pretendard', system-ui, sans-serif", "#f0a24e");
    centerText("오래 날다가 다음 밧줄을 잡으면 보물이 쌓인다 — 연속 성공은 최대 4배", H/2 + 12, "400 14px 'Pretendard', system-ui, sans-serif", "rgba(244,236,217,.72)");
    centerText("보스마다 약점이 여러 개고 전부 움직인다 — 빠른 속도로 부딪쳐라", H/2 + 36, "400 13px 'Pretendard', system-ui, sans-serif", "rgba(176,58,52,.95)");
    centerText("F키(화면에선 피스톨 버튼) — 고무고무 피스톨, 원거리 한 방 · 재충전 20초", H/2 + 58, "400 13px 'Pretendard', system-ui, sans-serif", "rgba(240,162,78,.95)");
    centerText("G키(화면에선 건 버튼) — 고무고무 엘리펀트 건, 광역 강타 · 재충전 2분", H/2 + 80, "400 13px 'Pretendard', system-ui, sans-serif", "rgba(143,79,208,.95)");
    centerText("식인 물고기는 휘청이게 하고, 해왕류는 피스톨이나 엘리펀트 건으로 물리칠 수 있다", H/2 + 102, "400 13px 'Pretendard', system-ui, sans-serif", "rgba(143,208,214,.9)");
    centerText("클릭 또는 Space로 출항", H/2 + 128, "400 13px 'Pretendard', system-ui, sans-serif", "rgba(244,236,217,.55)");
  } else if(state === STATE.OVER){
    ctx.fillStyle = "rgba(13,27,38,0.74)";
    ctx.fillRect(0,0,W,H);
    centerText(deathReason === "바다" ? "바다에 빠졌다"
             : deathReason === "해왕류" ? "해왕류에게 삼켜졌다" : "선단에 뒤처졌다", H/2 - 40, "700 29px 'Pretendard', system-ui, sans-serif", "#f4ecd9");
    centerText(Math.floor(dist) + "m · 보물 " + Math.floor(treasure), H/2 + 2, "600 17px 'Pretendard', system-ui, sans-serif", "#d9b877");
    centerText("클릭 · Space · R로 다시", H/2 + 40, "400 13px 'Pretendard', system-ui, sans-serif", "rgba(244,236,217,.55)");
  }
}

/* ---------- 루프 ---------- */
let last = performance.now();
function loop(now){
  let dt = (now - last) / (1000/60);
  last = now;
  if(dt > 3) dt = 3;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
document.addEventListener("visibilitychange", ()=>{
  last = performance.now();
  if(document.hidden && state === STATE.PLAY) togglePause();   // 창을 벗어나면 자동 정지
});

window.__swing = {
  peek: () => ({ x:p.x, y:p.y, vx:p.vx, vy:p.vy, rope, dist, treasure, state, SEA, boss, shots, stun, bossKills,
                 mobs, skillCd, fist, gunCd, gun, deathReason }),
  hold: (v) => { if(v){ if(!holding) grab(); } else release(false); },
  pause: togglePause,
  keys,
  pick: pickAnchor,
  fire: firePistol,
  fireGun: fireGun,
  reset: reset,
  weak: () => (boss ? weakPoints(boss) : [])
};

reset();
loadBest();
try{ canvas.focus({preventScroll:true}); }catch(e){}
requestAnimationFrame(loop);

})();
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
